name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Run the commonTest suites
        run: ./gradlew :composeApp:testDebugUnitTest :lab-ui:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            composeApp/build/reports/tests/
            lab-ui/build/reports/tests/

  ios-klibs:
    # Compiles the Kotlin/Native iOS klibs on Linux (kotlin.native.enableKlibsCrossCompilation):
    # catches commonMain/iosMain breakage without a Mac. No framework linking, no xcodebuild.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile the iOS klibs
        run: >-
          ./gradlew
          :lab-ui:compileKotlinIosArm64 :lab-ui:compileKotlinIosSimulatorArm64 :lab-ui:compileKotlinIosX64
          :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosX64
